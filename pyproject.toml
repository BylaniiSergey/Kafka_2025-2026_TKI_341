[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exoskeleton-prototype"
version = "0.1.0"
description = "Прототип подсистем реабилитационного экзоскелета (учебный проект)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
exoskeleton-demo = "exoskeleton.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["exoskeleton*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
